name: Build APK
on:
  push:
  workflow_dispatch:
env:
  CCACHE_COMPILERCHECK: content
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool make ninja-build pkg-config perl unzip zip
      - uses: android-actions/setup-android@v4
      - name: Android components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2
        with: { key: sbdroid-arm64, max-size: 2G }
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "engine/oSBM/source/vcpkg.json"
          vcpkgConfigurationJsonGlob: "engine/oSBM/source/vcpkg-configuration.json"
      - name: Build oSBM native lib (arm64) -> host jniLibs
        working-directory: engine/oSBM/source
        run: |
          cmake --preset android-arm64-release -DVCPKG_INSTALL_OPTIONS=--clean-after-build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset android-arm64-release --target starbound --parallel
          ls -l application/mobile/android/host/app/src/main/jniLibs/arm64-v8a/
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Debug keystore
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build SbDroid APK (release, fast)
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SbDroid-apk
          path: app/build/outputs/apk/release/*.apk
